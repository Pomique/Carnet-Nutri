<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;

const GOALS = [
  { value: "prise_de_muscle", label: "Prise de muscle", hint: "Léger surplus, riche en protéines" },
  { value: "perte_de_poids", label: "Perte de poids", hint: "Léger déficit calorique" },
  { value: "maintien", label: "Maintien", hint: "Équilibre autour de tes besoins" },
];
const ACTIVITY = [
  ["sedentaire", "Sédentaire — peu ou pas de sport", 1.2],
  ["modere", "Modéré — 2 à 3 séances / semaine", 1.375],
  ["actif", "Actif — 4 à 5 séances / semaine", 1.55],
  ["tres_actif", "Très actif — sport quotidien / physique", 1.725],
];
const SLOTS = [
  { type: "petit_dejeuner", label: "Petit-déjeuner" },
  { type: "dejeuner", label: "Déjeuner" },
  { type: "diner", label: "Dîner" },
  { type: "grignotage", label: "Grignotage" },
];
const WEEKDAYS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const GOAL_WEEKLY_RATE = { prise_de_muscle: 0.0035, perte_de_poids: -0.007, maintien: 0 }; // % du poids de corps / semaine

function computeTargets({ sex, age, heightCm, weightKg, activity, goal }) {
  const bmr = sex === "homme"
    ? 10 * weightKg + 6.25 * heightCm - 5 * age + 5
    : 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
  const factor = ACTIVITY.find(a => a[0] === activity)?.[2] || 1.375;
  const tdee = bmr * factor;

  // Rythme hebdomadaire sûr, proportionnel au poids (plutôt qu'un % arbitraire du TDEE)
  const weeklyRateKg = weightKg * GOAL_WEEKLY_RATE[goal];
  const dailyCalorieDelta = (weeklyRateKg * 7700) / 7; // ~7700 kcal par kg de masse corporelle
  const calories = Math.round(tdee + dailyCalorieDelta);

  const proteinPerKg = goal === "prise_de_muscle" ? 2.0 : goal === "perte_de_poids" ? 1.8 : 1.6;
  const protein = Math.round(weightKg * proteinPerKg);
  const fat = Math.round((calories * 0.28) / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat, weeklyRateKg };
}

function pad(n) { return String(n).padStart(2, "0"); }
function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayKey() { return toKey(new Date()); }
function mondayOf(date) {
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

function daysBetween(dateKeyA, dateKeyB) {
  const a = new Date(dateKeyA + "T00:00:00");
  const b = new Date(dateKeyB + "T00:00:00");
  return Math.round((a - b) / 86400000);
}

function previousWeightEntry(weights, beforeKey) {
  const entries = Object.entries(weights).filter(([k]) => k < beforeKey).sort(([a], [b]) => b.localeCompare(a));
  return entries[0] || null;
}

/** Compare la pesée de la semaine à l'évolution attendue selon l'objectif, et propose un ajustement de calories */
function suggestAdjustment(goal, prevEntry, currentKey, currentKg, currentTargets) {
  if (!prevEntry) return null;
  const [prevKey, prevKg] = prevEntry;
  const days = daysBetween(currentKey, prevKey);
  if (days < 4) return null; // trop récent pour être fiable
  const pctChange = ((currentKg - prevKg) / prevKg) * 100;
  const weeklyPct = pctChange * (7 / days);

  let delta = 0;
  let reason = "";
  if (goal === "perte_de_poids") {
    if (weeklyPct > -0.3) { delta = -150; reason = "Ton poids baisse trop lentement par rapport à l'objectif."; }
    else if (weeklyPct < -1.2) { delta = 150; reason = "Ton poids baisse plus vite que recommandé."; }
  } else if (goal === "prise_de_muscle") {
    if (weeklyPct < 0.15) { delta = 150; reason = "Ta prise de poids est trop lente pour progresser."; }
    else if (weeklyPct > 0.7) { delta = -100; reason = "Tu prends du poids plus vite que ce qui favorise le muscle (risque de prise de gras)."; }
  } else {
    if (weeklyPct > 0.5) { delta = -100; reason = "Ton poids a tendance à monter alors que l'objectif est le maintien."; }
    else if (weeklyPct < -0.5) { delta = 100; reason = "Ton poids a tendance à baisser alors que l'objectif est le maintien."; }
  }
  if (delta === 0) return null;

  const newCalories = Math.max(1200, currentTargets.calories + delta);
  const fat = Math.round((newCalories * 0.28) / 9);
  const protein = currentTargets.protein;
  const carbs = Math.max(0, Math.round((newCalories - protein * 4 - fat * 9) / 4));
  return { reason, delta, newTargets: { calories: newCalories, protein, carbs, fat } };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/** Redimensionne/compresse une photo avant analyse et stockage (limite la taille en localStorage) */
function compressImage(file, maxDim = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ dataUrl, base64: dataUrl.split(",")[1] });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/** Estime dans combien de semaines l'objectif de poids sera atteint, à partir de la tendance observée */
function computeProjection(weights, targetWeightKg) {
  if (!targetWeightKg) return null;
  const entries = Object.entries(weights).sort(([a], [b]) => a.localeCompare(b));
  if (entries.length < 2) return null;
  const [firstKey, firstKg] = entries[0];
  const [lastKey, lastKg] = entries[entries.length - 1];
  const weeks = daysBetween(lastKey, firstKey) / 7;
  if (weeks <= 0) return null;
  const weeklyRate = (lastKg - firstKg) / weeks;
  const remaining = targetWeightKg - lastKg;
  if (Math.abs(remaining) < 0.2) return { status: "reached" };
  if (Math.abs(weeklyRate) < 0.02) return { status: "stalled" };
  if (Math.sign(remaining) !== Math.sign(weeklyRate)) return { status: "wrong_direction" };
  return { status: "on_track", weeksRemaining: Math.max(1, Math.round(Math.abs(remaining / weeklyRate))) };
}

/** Nombre de jours consécutifs (jusqu'à hier, ou aujourd'hui si déjà renseigné) où les calories sont restées dans la cible */
function computeStreak(meals, targetCalories) {
  if (!targetCalories) return 0;
  let streak = 0;
  let cursor = new Date();
  const todayTotal = (meals[todayKey()] || []).reduce((s, m) => s + (m.calories || 0), 0);
  if (todayTotal === 0) cursor = addDays(cursor, -1);
  while (true) {
    const key = toKey(cursor);
    const dm = meals[key] || [];
    const total = dm.reduce((s, m) => s + (m.calories || 0), 0);
    if (total > 0 && total <= targetCalories * 1.05) {
      streak++;
      cursor = addDays(cursor, -1);
    } else break;
  }
  return streak;
}

/** Calories totales des 7 derniers jours (jour affiché inclus), pour la tendance */
function computeWeeklyTrend(meals, endDateKey) {
  const end = new Date(endDateKey + "T00:00:00");
  return Array.from({ length: 7 }, (_, i) => {
    const d = addDays(end, i - 6);
    const key = toKey(d);
    const total = (meals[key] || []).reduce((s, m) => s + (m.calories || 0), 0);
    return { key, label: WEEKDAYS[(d.getDay() + 6) % 7].slice(0, 2), total };
  });
}

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

async function analyzeMeal({ description, imageBase64, imageMediaType, apiKey }) {
  const key = (apiKey || "").trim();
  if (!key) throw new Error("Ajoute d'abord ta clé Gemini dans les réglages (icône ⚙).");
  const parts = [];
  const prompt = 'Tu es un nutritionniste expert. Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, au format exact : {"label": "nom court du repas", "calories": nombre, "protein": nombre_grammes, "carbs": nombre_grammes, "fat": nombre_grammes}. Donne ta meilleure estimation réaliste même si l\'information est incomplète.';
  parts.push({ text: prompt });
  if (description) parts.push({ text: `Description du repas : ${description}` });
  if (imageBase64) parts.push({ inline_data: { mime_type: imageMediaType || "image/jpeg", data: imageBase64 } });

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: { temperature: 0.2 } }),
  });
  if (!res.ok) {
    let detail = "";
    try {
      const errJson = await res.json();
      detail = errJson?.error?.message || "";
    } catch {}
    throw new Error(`Erreur Gemini (${res.status})${detail ? " : " + detail : ""}`);
  }
  const data = await res.json();
  const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
  const cleaned = rawText.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  return {
    label: parsed.label || "Repas",
    calories: Math.round(parsed.calories) || 0,
    protein: Math.round(parsed.protein) || 0,
    carbs: Math.round(parsed.carbs) || 0,
    fat: Math.round(parsed.fat) || 0,
  };
}

function Gauge({ label, value, target, unit, colorClass }) {
  const pct = target > 0 ? Math.min((value / target) * 100, 100) : 0;
  return (
    <div>
      <div className="flex justify-between font-mono text-xs mb-1 text-stone-500">
        <span>{label}</span>
        <span>{Math.round(value)} / {target} {unit}</span>
      </div>
      <div className="h-2 rounded-full bg-stone-200 overflow-hidden">
        <div className={`h-full rounded-full ${colorClass}`} style={{ width: `${pct}%` }} />
      </div>
    </div>
  );
}

function MacroDonut({ protein, carbs, fat, targets }) {
  const pCal = protein * 4, cCal = carbs * 4, fCal = fat * 9;
  const total = pCal + cCal + fCal;
  const r = 45, cx = 60, cy = 60, circumference = 2 * Math.PI * r;

  const idealTotal = targets ? targets.protein * 4 + targets.carbs * 4 + targets.fat * 9 : 0;
  const idealPct = (grams, kcalPerG) => (targets && idealTotal > 0 ? Math.round((grams * kcalPerG / idealTotal) * 100) : null);

  if (total === 0) {
    return <p className="text-stone-500 text-sm text-center py-8">Rien noté aujourd'hui pour l'instant.</p>;
  }
  const segments = [
    { label: "Protéines", value: pCal, color: "#10b981", idealPct: idealPct(targets?.protein || 0, 4) },
    { label: "Glucides", value: cCal, color: "#f43f5e", idealPct: idealPct(targets?.carbs || 0, 4) },
    { label: "Lipides", value: fCal, color: "#0ea5e9", idealPct: idealPct(targets?.fat || 0, 9) },
  ];
  let offset = 0;
  return (
    <div className="flex items-center gap-6">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#e7e5e4" strokeWidth="14" />
        {segments.map((s, i) => {
          const frac = s.value / total;
          const dash = frac * circumference;
          const circle = (
            <circle
              key={i}
              cx={cx} cy={cy} r={r}
              fill="none"
              stroke={s.color}
              strokeWidth="14"
              strokeDasharray={`${dash} ${circumference - dash}`}
              strokeDashoffset={-offset}
              transform={`rotate(-90 ${cx} ${cy})`}
            />
          );
          offset += dash;
          return circle;
        })}
      </svg>
      <div className="flex flex-col gap-2">
        {segments.map((s, i) => (
          <div key={i} className="flex items-center gap-2 text-sm">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: s.color }} />
            <span>{s.label}</span>
            <span className="font-mono text-xs text-stone-500">
              {Math.round((s.value / total) * 100)}%{s.idealPct !== null ? ` (cible ~${s.idealPct}%)` : ""}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function WeightChart({ weights }) {
  const entries = Object.entries(weights).sort(([a], [b]) => a.localeCompare(b));
  if (entries.length < 2) {
    return <p className="text-stone-500 text-sm">Note au moins 2 pesées pour voir la courbe.</p>;
  }
  const values = entries.map(([, v]) => v);
  const min = Math.min(...values) - 0.5;
  const max = Math.max(...values) + 0.5;
  const w = 300, h = 100;
  const points = entries.map(([, v], i) => {
    const x = (i / (entries.length - 1)) * w;
    const y = h - ((v - min) / (max - min)) * h;
    return `${x},${y}`;
  }).join(" ");
  const last = entries[entries.length - 1][1];
  const first = entries[0][1];
  const delta = (last - first).toFixed(1);
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-24">
        <polyline points={points} fill="none" stroke="#d97706" strokeWidth="2" />
      </svg>
      <p className="font-mono text-xs text-stone-500 mt-1">
        {first} kg → {last} kg ({delta > 0 ? "+" : ""}{delta} kg depuis le début du suivi)
      </p>
    </div>
  );
}

function Onboarding({ onDone, apiKey, onSaveApiKey }) {
  const [step, setStep] = useState(0);
  const [apiKeyInput, setApiKeyInput] = useState(apiKey || "");
  const [goal, setGoal] = useState(null);
  const [sex, setSex] = useState("homme");
  const [age, setAge] = useState("");
  const [heightCm, setHeightCm] = useState("");
  const [weightKg, setWeightKg] = useState("");
  const [activity, setActivity] = useState("modere");
  const [weighDay, setWeighDay] = useState(0);
  const [targetWeightKg, setTargetWeightKg] = useState("");

  const canEstimate = goal && age && heightCm && weightKg;
  const provisionalTargets = canEstimate
    ? computeTargets({ sex, age: Number(age), heightCm: Number(heightCm), weightKg: Number(weightKg), activity, goal })
    : null;
  const weeksEstimate = provisionalTargets && targetWeightKg && provisionalTargets.weeklyRateKg !== 0
    ? Math.round(Math.abs((Number(targetWeightKg) - Number(weightKg)) / provisionalTargets.weeklyRateKg))
    : null;

  function finish() {

/** Repas récents pour un créneau donné : dérivés de l'historique, dédupliqués, sans les favoris déjà proposés */
function computeRecent(meals, type, favorites) {
  const favDescriptions = new Set(favorites.filter(f => f.type === type).map(f => f.description));
  const all = Object.values(meals).flat().filter(m => m.type === type && !favDescriptions.has(m.description));
  const seen = new Set();
  const recent = [];
  for (const m of [...all].sort((a, b) => Number(b.id) - Number(a.id))) {
    if (seen.has(m.description)) continue;
    seen.add(m.description);
    recent.push(m);
    if (recent.length >= 6) break;
  }
  return recent;
}

function WeeklyTrend({ meals, endDateKey, target }) {
  const days = computeWeeklyTrend(meals, endDateKey);
  const max = Math.max(target, ...days.map(d => d.total)) || 1;
  return (
    <div className="bg-stone-100 text-stone-900 rounded-3xl shadow-xl shadow-black/30 p-5 mb-6">
      <h2 className="font-semibold mb-4">Tendance 7 jours</h2>
      <div className="flex items-end justify-between gap-2 h-28">
        {days.map((d, i) => {
          const h = Math.min((d.total / max) * 100, 100);
          const isEnd = d.key === endDateKey;
          const ratio = d.total ? d.total / target : 0;
          const barColor = d.total === 0 ? "bg-stone-200" : ratio <= 1.05 ? "bg-emerald-500" : "bg-rose-500";
          return (
            <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
              <div className={`w-full rounded-t-md ${barColor} ${isEnd ? "ring-2 ring-amber-500" : ""}`} style={{ height: `${h}%`, minHeight: d.total ? "4px" : "2px" }} />
              <span className="font-mono text-[10px] text-stone-500 mt-1">{d.label}</span>
            </div>
          );
        })}
      </div>
      <p className="font-mono text-xs text-stone-500 mt-3">Cible : {target} kcal/j</p>
    </div>
  );
}

        )}
        {streak === 0 && <div className="mb-6" />}

        <button onClick={onOpenWeight} className="w-full bg-stone-100 text-stone-900 rounded-3xl shadow-xl shadow-black/30 p-5 text-left mb-6">
          <div className="flex justify-between items-center mb-2">
            <h2 className="font-semibold">Suivi du poids</h2>
            <span className="font-mono text-xs text-amber-600">voir tout →</span>
          </div>
          {latestWeight ? (
            <p className="font-mono text-sm text-stone-600">Dernière pesée : {latestWeight[1]} kg</p>
          ) : (
            <p className="text-stone-500 text-sm">Pas encore de pesée enregistrée</p>
          )}
          {profile.targetWeightKg && (() => {
            const projection = computeProjection(weights, profile.targetWeightKg);
            if (projection?.status === "on_track") {
              return <p className="font-mono text-xs text-amber-600 mt-1">→ objectif dans ~{projection.weeksRemaining} sem.</p>;
            }
            return null;
          })()}
        </button>

        <div className="bg-stone-100 text-stone-900 rounded-3xl shadow-xl shadow-black/30 p-5 mb-6">
          <div className="flex items-center justify-between mb-3">
            <button onClick={() => setMacroView(v => v === "gauges" ? "chart" : "gauges")} className="text-stone-400 hover:text-stone-900 px-1">←</button>
            <span className="font-mono text-xs text-stone-400 uppercase tracking-wide">{macroView === "gauges" ? "Jauges" : "Répartition"}</span>
            <button onClick={() => setMacroView(v => v === "gauges" ? "chart" : "gauges")} className="text-stone-400 hover:text-stone-900 px-1">→</button>
          </div>
          <div className="min-h-[210px] flex flex-col justify-center">
            {macroView === "gauges" ? (
              <div className="flex flex-col gap-3">
                <Gauge label={exerciseCalories > 0 ? `Calories (+${exerciseCalories} sport)` : "Calories"} value={totals.calories} target={effectiveCalorieTarget} unit="kcal" colorClass="bg-amber-500" />
                <Gauge label="Protéines" value={totals.protein} target={targets.protein} unit="g" colorClass="bg-emerald-500" />
                <Gauge label="Glucides" value={totals.carbs} target={targets.carbs} unit="g" colorClass="bg-rose-500" />
                <Gauge label="Lipides" value={totals.fat} target={targets.fat} unit="g" colorClass="bg-sky-500" />
              </div>
            ) : (
              <MacroDonut protein={totals.protein} carbs={totals.carbs} fat={totals.fat} targets={targets} />
            )}
          </div>
        </div>

        <WeeklyTrend meals={allMeals} endDateKey={date} target={targets.calories} />
        <WaterTracker count={waterCount} onSet={onSetWater} />
        <ExerciseSection exercises={dayExercises} weightKg={profile.weightKg} apiKey={apiKey} onAdd={onAddExercise} onRemove={onRemoveExercise} />

        <div className="flex flex-col gap-4">
          {SLOTS.map(slot => {
            const slotMeals = dayMeals.filter(m => m.type === slot.type);
            return (
              <div key={slot.type}>
                <div className="flex items-center justify-between mb-2">
                  <h2 className="text-lg font-semibold">{slot.label}</h2>
                  <button onClick={() => { setOpenSlot(slot.type); setMode("describe"); setSearch(""); }} className="text-amber-500 font-mono text-sm">+ ajouter</button>
                </div>
                {slotMeals.length === 0 ? <p className="text-stone-600 text-sm">Rien noté</p> : (
                  <ul className="flex flex-col gap-2">
                    {slotMeals.map(m => editingId === m.id ? (
                      <EditMealForm key={m.id} meal={m} onCancel={() => setEditingId(null)} onSave={(updated) => { onEditMeal(updated); setEditingId(null); }} />
                    ) : (
                      <li key={m.id} className="bg-stone-100 text-stone-900 rounded-2xl shadow-md shadow-black/20 px-4 py-3 flex justify-between items-start gap-3">
                        {m.photo && <img src={m.photo} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0" />}
                        <div className="flex-1">
                          <p className="font-medium">{m.description}</p>
                          <p className="font-mono text-xs text-stone-500">{m.calories} kcal · P{m.protein} G{m.carbs} L{m.fat}</p>
                        </div>
                        <div className="flex gap-2 shrink-0">
                          <button onClick={() => setEditingId(m.id)} className="text-stone-400 hover:text-amber-600 text-sm">✎</button>
                          <button onClick={() => removeMealWithUndo(m)} className="text-stone-400 hover:text-rose-500 text-sm">✕</button>
                        </div>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            );
          })}
        </div>

        {openSlot && (
          <div className="fixed inset-0 bg-black bg-opacity-70 flex items-end sm:items-center justify-center z-50 p-4" style={{ paddingBottom: "max(1rem, env(safe-area-inset-bottom))" }}>
            <div className="bg-stone-100 text-stone-900 rounded-3xl shadow-xl shadow-black/30 w-full max-w-sm p-6 max-h-[85vh] overflow-y-auto">
              <h3 className="text-xl font-semibold mb-4">{SLOTS.find(s => s.type === openSlot)?.label}</h3>

              <div className="grid grid-cols-3 gap-1 bg-stone-200 rounded-xl p-1 mb-4">
                {[["describe", "Décrire"], ["photo", "Photo"], ["quick", "Favoris"]].map(([m, label]) => (
                  <button
                    key={m}
                    onClick={() => setMode(m)}
                    className={`py-2 rounded-lg text-xs font-medium ${mode === m ? "bg-stone-900 text-stone-100" : "text-stone-600"}`}
                  >
                    {label}
                  </button>
                ))}
              </div>

              {mode === "describe" && (
                <>
                  <textarea value={text} onChange={e => setText(e.target.value)} placeholder="Décris ce que tu as mangé..." rows={3} className="w-full border border-stone-300 rounded-lg px-3 py-2 mb-4" autoFocus />
                  {error && <p className="text-rose-500 text-sm mb-3">{error}</p>}
                  <div className="flex gap-2">
                    <button onClick={closeModal} className="px-4 py-3 rounded-xl border border-stone-300">Annuler</button>
                    <button onClick={submit} disabled={loading || !text.trim()} className="flex-1 bg-amber-500 text-stone-900 font-medium py-3 rounded-xl disabled:opacity-40">
                      {loading ? "Analyse en cours..." : "Analyser & ajouter"}
                    </button>
                  </div>
                </>
              )}

              {mode === "photo" && (
                <>
                  <input type="file" accept="image/*" onChange={e => setPhoto(e.target.files?.[0] || null)} className="mb-4 text-sm w-full" />
                  {error && <p className="text-rose-500 text-sm mb-3">{error}</p>}
                  <div className="flex gap-2">
                    <button onClick={closeModal} className="px-4 py-3 rounded-xl border border-stone-300">Annuler</button>
                    <button onClick={submit} disabled={loading || !photo} className="flex-1 bg-amber-500 text-stone-900 font-medium py-3 rounded-xl disabled:opacity-40">
                      {loading ? "Analyse en cours..." : "Analyser & ajouter"}
                    </button>
                  </div>
                </>
              )}

              {mode === "quick" && (
                <>
                  <input
                    type="text"
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    placeholder="Rechercher..."
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 mb-4 text-sm"
                  />
                  {(() => {
                    const q = search.trim().toLowerCase();
                    const favs = favorites.filter(f => f.type === openSlot && f.description.toLowerCase().includes(q));
                    const recent = computeRecent(allMeals, openSlot, favorites).filter(m => m.description.toLowerCase().includes(q));
                    if (favs.length === 0 && recent.length === 0) {
                      return <p className="text-stone-500 text-sm mb-2">{q ? "Rien ne correspond à ta recherche." : "Rien à afficher pour l'instant — ajoute un repas via \"Décrire\" ou \"Photo\", il apparaîtra ici la prochaine fois."}</p>;
                    }
                    return (
                      <>
                        {favs.length > 0 && (
                          <div className="mb-4">
                            <p className="text-xs text-stone-500 mb-2">★ Favoris</p>
                            <div className="flex flex-col gap-2">
                              {favs.map(f => (
                                <div key={f.id} className="flex items-center gap-2">
                                  <button onClick={() => quickAdd(f)} className="flex-1 text-left text-sm border border-stone-300 rounded-lg px-3 py-2 hover:border-amber-500">
                                    <span className="font-medium">{f.description}</span>
                                    <span className="block font-mono text-xs text-stone-500">{f.calories} kcal · P{f.protein} G{f.carbs} L{f.fat}</span>
                                  </button>
                                  <button onClick={() => onRemoveFavorite(f.id)} className="text-amber-500 text-lg px-1" title="Retirer des favoris">★</button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                        {recent.length > 0 && (
                          <div className="mb-2">
                            <p className="text-xs text-stone-500 mb-2">Récents</p>
                            <div className="flex flex-col gap-2">
                              {recent.map(m => (
                                <div key={m.id} className="flex items-center gap-2">
                                  <button onClick={() => quickAdd(m)} className="flex-1 text-left text-sm border border-stone-300 rounded-lg px-3 py-2 hover:border-amber-500">
                                    <span className="font-medium">{m.description}</span>
                                    <span className="block font-mono text-xs text-stone-500">{m.calories} kcal · P{m.protein} G{m.carbs} L{m.fat}</span>
                                  </button>
                                  <button onClick={() => onSaveFavorite(m)} className="text-stone-300 hover:text-amber-500 text-lg px-1" title="Ajouter aux favoris">☆</button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </>
                    );
                  })()}
                  <button onClick={closeModal} className="w-full mt-2 px-4 py-3 rounded-xl border border-stone-300">Fermer</button>
                </>
              )}
            </div>
          </div>
        )}

        {undoMeal && (
          <div className="fixed bottom-4 inset-x-4 z-50 flex justify-center">
            <div className="bg-stone-900 text-stone-100 rounded-xl px-4 py-3 flex items-center gap-4 shadow-lg">
              <span className="text-sm">Repas supprimé</span>
              <button onClick={undoDelete} className="text-amber-400 font-medium text-sm">Annuler</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [profile, setProfile] = useState(() => load("nutri_profile", null));
  const [meals, setMeals] = useState(() => load("nutri_meals", {}));
  const [weights, setWeights] = useState(() => load("nutri_weights", {}));
  const [favorites, setFavorites] = useState(() => load("nutri_favorites", []));
  const [water, setWater] = useState(() => load("nutri_water", {}));
  const [exercises, setExercises] = useState(() => load("nutri_exercises", {}));
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("nutri_gemini_key") || "");
  const [view, setView] = useState("day");
  const [selectedDate, setSelectedDate] = useState(() => todayKey());
  const [showSettings, setShowSettings] = useState(false);
  const [showWeigh, setShowWeigh] = useState(false);
  const [adjustment, setAdjustment] = useState(null);

  useEffect(() => {
    if (!profile) return;
    const today = new Date();
    const isWeighDay = (today.getDay() + 6) % 7 === profile.weighDay;
    const alreadyLogged = weights[todayKey()] !== undefined;
    if (isWeighDay && !alreadyLogged) setShowWeigh(true);
  }, [profile]);

  function updateProfile(p) { setProfile(p); save("nutri_profile", p); }
  function updateMeals(m) { setMeals(m); save("nutri_meals", m); }
  function updateWeights(w) { setWeights(w); save("nutri_weights", w); }
  function updateFavorites(f) { setFavorites(f); save("nutri_favorites", f); }
  function updateApiKey(k) { setApiKey(k); localStorage.setItem("nutri_gemini_key", k); }
  function updateWater(w) { setWater(w); save("nutri_water", w); }
  function updateExercises(e) { setExercises(e); save("nutri_exercises", e); }

  function recordWeight(kg) {
    const key = todayKey();
    const prevEntry = previousWeightEntry(weights, key);
    const nextWeights = { ...weights, [key]: kg };
    updateWeights(nextWeights);
    setShowWeigh(false);
    const suggestion = suggestAdjustment(profile.goal, prevEntry, key, kg, profile.targets);
    if (suggestion) setAdjustment(suggestion);
  }

  if (!profile) return <Onboarding onDone={updateProfile} apiKey={apiKey} onSaveApiKey={updateApiKey} />;

  return (
    <>
      {showSettings && <SettingsModal apiKey={apiKey} onSave={updateApiKey} onClose={() => setShowSettings(false)} />}
      {showWeigh && (
        <WeighModal
          onSkip={() => setShowWeigh(false)}
          onSave={recordWeight}
        />
      )}

      {adjustment && (
        <AdjustmentModal
          suggestion={adjustment}
          onIgnore={() => setAdjustment(null)}
          onAccept={() => { updateProfile({ ...profile, targets: adjustment.newTargets }); setAdjustment(null); }}
        />
      )}

      {view === "day" && (
        <DayView
          date={selectedDate}
          profile={profile}
          weights={weights}
          dayMeals={meals[selectedDate] || []}
          allMeals={meals}
          favorites={favorites}
          apiKey={apiKey}
          onNavigateDay={(delta) => setSelectedDate(toKey(addDays(new Date(selectedDate + "T00:00:00"), delta)))}
          onGoToday={() => setSelectedDate(todayKey())}
          onEditProfile={() => updateProfile(null)}
          onOpenSettings={() => setShowSettings(true)}
          onOpenWeight={() => setView("weight")}
          onAddMeal={(meal) => updateMeals({ ...meals, [selectedDate]: [...(meals[selectedDate] || []), meal] })}
          onRemoveMeal={(id) => updateMeals({ ...meals, [selectedDate]: (meals[selectedDate] || []).filter(m => m.id !== id) })}
          onEditMeal={(updated) => updateMeals({ ...meals, [selectedDate]: (meals[selectedDate] || []).map(m => m.id === updated.id ? updated : m) })}
          onSaveFavorite={(meal) => updateFavorites([...favorites, { id: `fav_${Date.now()}`, type: meal.type, description: meal.description, calories: meal.calories, protein: meal.protein, carbs: meal.carbs, fat: meal.fat }])}
          onRemoveFavorite={(id) => updateFavorites(favorites.filter(f => f.id !== id))}
          waterCount={water[selectedDate] || 0}
          onSetWater={(n) => updateWater({ ...water, [selectedDate]: Math.max(0, n) })}
          dayExercises={exercises[selectedDate] || []}
          onAddExercise={(ex) => updateExercises({ ...exercises, [selectedDate]: [...(exercises[selectedDate] || []), ex] })}
          onRemoveExercise={(id) => updateExercises({ ...exercises, [selectedDate]: (exercises[selectedDate] || []).filter(e => e.id !== id) })}
        />
      )}

      {view === "weight" && (
        <WeightPage
          weights={weights}
          targetWeightKg={profile.targetWeightKg}
          onBack={() => setView("day")}
          onAdd={(date, kg) => updateWeights({ ...weights, [date]: kg })}
          onUpdateTarget={(kg) => updateProfile({ ...profile, targetWeightKg: kg })}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
